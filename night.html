<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindle Home - Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
    position: relative;
    -webkit-text-size-adjust: 100%;
  }

  /* --- SKY LAYERS (black & white) --- */
  /* A faint grayscale haze band = the Milky Way, in grays only. */
  .haze {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(60% 40% at 72% 30%, rgba(255,255,255,0.14), rgba(255,255,255,0) 70%),
      linear-gradient(115deg, rgba(255,255,255,0) 38%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0) 62%);
  }
  #stars { position: absolute; inset: 0; z-index: 1; }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    opacity: 0.85;
  }
  /* A few stars twinkle on a color screen; on e-ink they just sit still. */
  @keyframes twinkle { 0%,100%{opacity:.9} 50%{opacity:.25} }
  .tw { animation: twinkle 3.5s ease-in-out infinite; }

  /* --- SHOOTING STARS ---
     A bright head with a tapering tail, sliding slowly across the sky.
     Long durations + big delays = occasional and calm, like you asked. */
  .shoot {
    position: absolute; z-index: 2;
    width: 160px; height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 85%, #fff 100%);
    border-radius: 2px;
    opacity: 0;
    transform: rotate(18deg);
  }
  .shoot:before {
    content: ""; position: absolute; right: -3px; top: -2px;
    width: 6px; height: 6px; background: #fff; border-radius: 50%;
    box-shadow: 0 0 8px 2px rgba(255,255,255,0.8);
  }
  @keyframes shoot {
    0%   { opacity: 0; transform: translate(0,0) rotate(18deg); }
    8%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { opacity: 0; transform: translate(560px, 182px) rotate(18deg); }
  }
  .s1 { top: 14%; left: -12%; animation: shoot 11s linear 2s infinite; }
  .s2 { top: 30%; left: -12%; animation: shoot 13s linear 9s infinite; }
  .s3 { top: 8%;  left: 18%;  animation: shoot 12s linear 17s infinite; }

  /* --- CONTENT (white, over the sky) --- */
  .wrap { position: relative; z-index: 3; padding: 26px 30px 36px; height: 100%; }
  .ts { text-shadow: 0 1px 6px rgba(0,0,0,0.9); }  /* keeps text legible over stars */

  .topbar { display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 2px solid rgba(255,255,255,0.6); padding-bottom: 12px; }
  .clock { font-size: 60px; font-weight: bold; letter-spacing: 1px; }
  .colon { animation: twinkle 2s steps(1,end) infinite; }
  .date { font-size: 24px; text-align: right; line-height: 1.3; }

  .progress-wrap { margin-top: 20px; }
  .progress-label { font-size: 15px; text-transform: uppercase; letter-spacing: 2px;
    display: flex; justify-content: space-between; margin-bottom: 6px; }
  .progress-track { border: 2px solid rgba(255,255,255,0.7); height: 22px; }
  .progress-fill { background: #fff; height: 100%; width: 0; }

  h2 { font-size: 21px; text-transform: uppercase; letter-spacing: 3px;
    margin: 26px 0 10px; border-bottom: 1px solid rgba(255,255,255,0.5); padding-bottom: 5px; }
  ul { list-style: none; }
  li { font-size: 27px; line-height: 1.5; padding: 5px 0 5px 38px; position: relative; }
  li:before { content: ""; position: absolute; left: 0; top: 11px;
    width: 20px; height: 20px; border: 2px solid #fff; }

  .two-col { display: table; width: 100%; }
  .col { display: table-cell; width: 50%; vertical-align: top; }
  .col:first-child { padding-right: 20px; }

  .quote { font-size: 24px; font-style: italic; line-height: 1.5; margin-top: 26px;
    border-left: 4px solid rgba(255,255,255,0.8); padding: 4px 0 4px 18px; min-height: 72px; }

  .footer { margin-top: 26px; border-top: 1px solid rgba(255,255,255,0.4); padding-top: 10px;
    font-size: 16px; display: flex; justify-content: space-between; opacity: 0.85; }
</style>
</head>
<body>
  <div class="haze"></div>
  <div id="stars"></div>
  <div class="shoot s1"></div>
  <div class="shoot s2"></div>
  <div class="shoot s3"></div>

  <div class="wrap">
    <div class="topbar ts">
      <div class="clock"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span></div>
      <div class="date" id="date">&nbsp;</div>
    </div>

    <div class="progress-wrap ts">
      <div class="progress-label"><span>Day</span><span id="pct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
    </div>

    <div class="two-col ts">
      <div class="col">
        <h2>Today</h2>
        <ul>
          <li>Read 30 minutes</li>
          <li>Walk</li>
          <li>Review Claude Code lesson</li>
        </ul>
      </div>
      <div class="col">
        <h2>Reading</h2>
        <ul>
          <li>[Current book title]</li>
          <li>[Next up]</li>
        </ul>
      </div>
    </div>

    <div class="quote ts" id="quote">&ldquo;&nbsp;&rdquo;</div>

    <div class="footer ts">
      <span>Kindle Home</span>
      <span id="refreshed">&nbsp;</span>
    </div>
  </div>

<script>
  function pad(n){ return (n < 10 ? "0" : "") + n; }

  // Build a starfield: scatter white dots, a few set to twinkle.
  (function(){
    var box = document.getElementById("stars");
    var html = "";
    for (var i = 0; i < 130; i++){
      var size = (Math.random() < 0.85) ? 1 + Math.random()*1.4 : 2 + Math.random()*1.6;
      var x = Math.random()*100, y = Math.random()*100;
      var op = 0.4 + Math.random()*0.55;
      var tw = (Math.random() < 0.18) ? " tw" : "";
      var delay = (Math.random()*3.5).toFixed(2);
      html += '<div class="star'+tw+'" style="left:'+x.toFixed(2)+'%;top:'+y.toFixed(2)+'%;width:'+size.toFixed(1)+'px;height:'+size.toFixed(1)+'px;opacity:'+op.toFixed(2)+';animation-delay:'+delay+'s"></div>';
    }
    box.innerHTML = html;
  })();

  // Neutral reading quotes (placeholders you can swap for your own).
  var quotes = [
    "A reader lives a thousand lives before he dies.",
    "The man who does not read has no advantage over the man who cannot read.",
    "So many books, so little time.",
    "Today a reader, tomorrow a leader.",
    "Read 20 pages. That is the whole plan.",
    "You are what you repeatedly do."
  ];
  var qi = 0;

  function draw(){
    var d = new Date();
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    document.getElementById("hh").innerHTML = pad(d.getHours());
    document.getElementById("mm").innerHTML = pad(d.getMinutes());
    document.getElementById("date").innerHTML = days[d.getDay()] + "<br>" + months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
    var secs = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
    var pct = Math.round(secs / 864);
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("pct").innerHTML = pct + "%";
    document.getElementById("refreshed").innerHTML = "Refreshed " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function rotateQuote(){
    document.getElementById("quote").innerHTML = "&ldquo;" + quotes[qi] + "&rdquo;";
    qi = (qi + 1) % quotes.length;
  }
  draw(); rotateQuote();
  setInterval(draw, 60000);
  setInterval(rotateQuote, 20000);
</script>
</body>
</html>
