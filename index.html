<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindle Home</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #ffffff;
    color: #000000;
    font-family: Georgia, "Times New Roman", serif;
    -webkit-text-size-adjust: 100%;
  }
  body { padding: 28px 30px 40px; }

  /* --- ANIMATION LAYER ---
     These run full-speed on a color screen (phone / Fire tablet).
     On e-ink the mid-frames don't render, but every element SETTLES to
     its final look, so the page is always correct either way. */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.25; }
  }
  .anim { animation: rise 700ms ease-out both; }
  .anim2 { animation: rise 700ms ease-out 150ms both; }
  .anim3 { animation: rise 700ms ease-out 300ms both; }
  .anim4 { animation: rise 700ms ease-out 450ms both; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 4px solid #000;
    padding-bottom: 14px;
  }
  .clock { font-size: 64px; font-weight: bold; letter-spacing: 1px; }
  /* The colon pulses on a color screen; on e-ink it just stays solid. */
  .colon { animation: pulse 2s steps(1,end) infinite; }
  .date  { font-size: 26px; text-align: right; line-height: 1.3; }

  /* --- DAY PROGRESS ---
     E-ink-friendly "motion": a bar that is further along each time the
     page repaints, so you watch the day fill up over hours. */
  .progress-wrap { margin-top: 22px; }
  .progress-label {
    font-size: 16px; text-transform: uppercase; letter-spacing: 2px;
    display: flex; justify-content: space-between; margin-bottom: 6px;
  }
  .progress-track { border: 3px solid #000; height: 26px; width: 100%; }
  .progress-fill { background: #000; height: 100%; width: 0; }

  h2 {
    font-size: 24px; text-transform: uppercase; letter-spacing: 3px;
    margin: 30px 0 12px; border-bottom: 2px solid #000; padding-bottom: 6px;
  }
  ul { list-style: none; }
  li {
    font-size: 30px; line-height: 1.5; padding: 6px 0 6px 40px; position: relative;
  }
  li:before {
    content: ""; position: absolute; left: 0; top: 12px;
    width: 22px; height: 22px; border: 3px solid #000;
  }
  .two-col { display: table; width: 100%; }
  .col { display: table-cell; width: 50%; vertical-align: top; }
  .col:first-child { padding-right: 24px; }

  /* --- ROTATING LINE ---
     Swaps text on a timer. Each swap is a full repaint e-ink handles. */
  .quote {
    font-size: 26px; font-style: italic; line-height: 1.5; margin-top: 30px;
    border-left: 6px solid #000; padding: 4px 0 4px 20px; min-height: 80px;
  }

  .footer {
    margin-top: 34px; border-top: 2px solid #000; padding-top: 12px;
    font-size: 18px; display: flex; justify-content: space-between;
  }
</style>
</head>
<body>

  <div class="topbar anim">
    <div class="clock"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span></div>
    <div class="date" id="date">&nbsp;</div>
  </div>

  <div class="progress-wrap anim2">
    <div class="progress-label"><span>Day</span><span id="pct">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
  </div>

  <div class="two-col anim3">
    <div class="col">
      <h2>Today</h2>
      <ul>
        <li>Read 30 minutes</li>
        <li>Walk</li>
        <li>Review Claude Code lesson</li>
      </ul>
    </div>
    <div class="col">
      <h2>Reading</h2>
      <ul>
        <li>[Current book title]</li>
        <li>[Next up]</li>
      </ul>
    </div>
  </div>

  <div class="quote anim4" id="quote">&ldquo;&nbsp;&rdquo;</div>

  <div class="footer anim4">
    <span>Kindle Home</span>
    <span id="refreshed">&nbsp;</span>
  </div>

<script>
  function pad(n){ return (n < 10 ? "0" : "") + n; }

  var quotes = [
    "A reader lives a thousand lives before he dies.",
    "The man who does not read has no advantage over the man who cannot read.",
    "So many books, so little time.",
    "Today a reader, tomorrow a leader.",
    "Read 20 pages. That is the whole plan.",
    "You are what you repeatedly do."
  ];
  var qi = 0;

  function draw(){
    var d = new Date();
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    document.getElementById("hh").innerHTML = pad(d.getHours());
    document.getElementById("mm").innerHTML = pad(d.getMinutes());
    document.getElementById("date").innerHTML = days[d.getDay()] + "<br>" + months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();

    // Day progress: fraction of the 24h day elapsed.
    var secs = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
    var pct = Math.round(secs / 864);          // out of 100
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("pct").innerHTML = pct + "%";

    document.getElementById("refreshed").innerHTML = "Refreshed " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function rotateQuote(){
    document.getElementById("quote").innerHTML = "&ldquo;" + quotes[qi] + "&rdquo;";
    qi = (qi + 1) % quotes.length;
  }

  draw();
  rotateQuote();
  // Clock + progress refresh each minute; quote rotates slower so e-ink
  // isn't repainting constantly (constant repaint = flicker on e-ink).
  setInterval(draw, 60000);
  setInterval(rotateQuote, 20000);
</script>

</body>
</html>
