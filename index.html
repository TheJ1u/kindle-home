<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindle Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #fff; color: #000;
    font-family: Georgia, "Times New Roman", serif;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
  }

  /* position:fixed so each screen always fills the Kindle viewport
     (absolute was only covering content height -> white gap at bottom). */
  .screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    padding: 26px 32px 54px;
    display: none; flex-direction: column;
    z-index: 2;
  }
  .screen.active { display: flex; }

  /* --- Subtle animated background for the light slides ---
     Faint gray shapes drift slowly. On a color screen it's a gentle
     texture; on e-ink it's nearly invisible, so text stays crisp. */
  .bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border: 2px solid rgba(0,0,0,0.05); border-radius: 50%; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(28px,-22px)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-26px,24px)} }
  .b1 { width: 320px; height: 320px; top: -90px; right: -70px; animation: drift1 22s ease-in-out infinite; }
  .b2 { width: 220px; height: 220px; bottom: 30px; left: -80px; animation: drift2 26s ease-in-out infinite; }
  .b3 { width: 120px; height: 120px; top: 44%; right: 10%; border-color: rgba(0,0,0,0.04); animation: drift1 30s ease-in-out infinite; }

  .kicker { font-size: 15px; letter-spacing: 4px; text-transform: uppercase; }
  .rule { border: 0; border-top: 3px solid #000; margin: 10px 0 14px; }

  /* ---------- SCREEN 1: TO-DO ---------- */
  .td-head { display: flex; justify-content: space-between; align-items: baseline; }
  .td-clock { font-size: 40px; font-weight: bold; }
  .td-date { font-size: 18px; }
  ul { list-style: none; margin-top: 10px; }
  /* The list fills the leftover space and scrolls when there are many tasks. */
  #todoList { flex: 1 1 auto; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  .scrollcue { text-align: center; font-size: 22px; line-height: 1; opacity: 0.5; margin-top: 2px; }
  li.todo { font-size: 29px; line-height: 1.4; padding: 7px 0 7px 42px; position: relative; }
  li.todo:before { content: ""; position: absolute; left: 0; top: 11px;
    width: 24px; height: 24px; border: 3px solid #000; }
  li.todo.done { }
  li.todo.done:before { background: #000; }
  /* check mark drawn with a ::after on done items */
  li.todo.done:after { content: ""; position: absolute; left: 7px; top: 13px;
    width: 10px; height: 5px; border-left: 3px solid #fff; border-bottom: 3px solid #fff;
    transform: rotate(-45deg); }
  li.todo.done span { text-decoration: line-through; opacity: 0.55; }
  .td-empty { font-size: 22px; font-style: italic; opacity: 0.6; margin-top: 16px; }

  /* ---------- SCREEN 2: READING ---------- */
  .book-title { font-size: 38px; font-weight: bold; line-height: 1.15; margin-top: 4px; }
  .book-sub { font-size: 21px; font-style: italic; margin-top: 8px; }
  .bar-label { font-size: 15px; letter-spacing: 2px; text-transform: uppercase;
    display: flex; justify-content: space-between; margin: 20px 0 7px; }
  .track { border: 3px solid #000; height: 26px; }
  .fill { background: #000; height: 100%; width: 0; }
  .pages-row { display: flex; gap: 9px; margin-top: 8px; flex-wrap: wrap; }
  .pg { width: 28px; height: 38px; border: 3px solid #000; }
  .pg.done { background: #000; }
  .big-num { font-size: 66px; font-weight: bold; line-height: 1; }
  .stat-row { display: flex; gap: 46px; margin-top: 12px; }
  .stat small { display: block; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }

  /* ---------- SCREEN 2: FOCUS (scripture with a themed full-screen scene) ---------- */
  .focus { justify-content:center; align-items:center; text-align:center; padding:52px 38px; color:#fff; background:#05060a; }
  .focus .scene { position:absolute; inset:0; z-index:1; display:none; overflow:hidden; }
  .focus .scene.on { display:block; }
  .focus .scene svg { position:absolute; inset:0; width:100%; height:100%; }
  .focus #sceneMoon   { background: radial-gradient(130% 100% at 50% 10%, #0e0e16, #000 74%); }
  .focus #sceneFinger { background: radial-gradient(85% 55% at 50% 6%, #20202a, #05060a 70%); }
  .focus #sceneDawn   { background: linear-gradient(180deg,#05060a 0%, #0e0e16 52%, #23232e 100%); }
  .focus #scenePond   { background: linear-gradient(180deg,#0a0a12 0%, #10101a 42%, #1b1b26 66%, #0c0c12 100%); }
  .focus .star { position:absolute; background:#fff; border-radius:50%; }
  .focus .moonSm { position:absolute; top:5%; left:7%; width:86px; height:86px; border-radius:50%;
    background: radial-gradient(circle at 36% 34%, #fff 0%, #dcdcdc 48%, #8f8f8f 74%, #555 100%);
    box-shadow:0 0 38px 8px rgba(255,255,255,0.14); }
  .focus .moonSm b { position:absolute; border-radius:50%; background:rgba(90,90,90,0.45); }
  /* soft dark center keeps the verse readable over any scene */
  .focus .vignette { position:absolute; inset:0; z-index:2;
    background: radial-gradient(72% 56% at 50% 50%, rgba(0,0,0,0.62), rgba(0,0,0,0.22) 72%, rgba(0,0,0,0) 100%); }
  .focus .inner { position:relative; z-index:3; width:86%; max-width:440px; margin:0 auto; }
  .focus .ref { font-size:16px; letter-spacing:4px; text-transform:uppercase; opacity:0.9; margin-bottom:14px; }
  .focus .fverse { font-size:20px; font-style:italic; line-height:1.5; word-wrap:break-word; overflow-wrap:break-word;
    text-shadow:0 1px 8px #000, 0 0 14px rgba(0,0,0,0.9); }

  /* ---------- SCREEN 4: THE YEAR ---------- */
  .year-top { display: flex; justify-content: space-between; align-items: flex-end; }
  .year-top .n { font-size: 60px; font-weight: bold; line-height: 1; }
  .year-top small { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(28, 1fr); gap: 4px; margin-top: 18px; }
  .cell { width: 100%; padding-bottom: 100%; border: 1px solid #000; }
  .cell.on { background: #000; }

  /* ---------- SCREEN 5: THE WEEK ---------- */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-top: 4px; }
  .day { border: 2px solid #000; padding: 9px 3px; text-align: center; }
  .day .dn { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .day .dd { font-size: 28px; font-weight: bold; margin-top: 3px; }
  .day.today { background: #000; color: #fff; }
  .agenda { margin-top: 20px; }
  .agenda div { font-size: 23px; line-height: 1.6; padding-left: 18px; border-left: 4px solid #000; margin-bottom: 11px; }

  .foot { position: absolute; left: 32px; right: 32px; bottom: 16px; z-index: 4;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
  .foot.onfocus { color: #fff; }
  .navarrow { font-size: 30px; font-weight: bold; line-height: 1; opacity: 0.55; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 9px; height: 9px; border: 2px solid currentColor; border-radius: 50%; }
  .dot.on { background: currentColor; }
</style>
</head>
<body>

  <!-- SCREEN 1: TO-DO (fed by todo.txt) -->
  <section class="screen active" data-name="To-Do">
    <div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
    <div class="td-head">
      <div class="kicker">To-Do</div>
      <div style="text-align:right">
        <div class="td-clock"><span id="hh">--</span>:<span id="mm">--</span></div>
        <div class="td-date" id="date">&nbsp;</div>
      </div>
    </div>
    <hr class="rule">
    <ul id="todoList"><li class="td-empty">Loading your list&hellip;</li></ul>
    <div class="scrollcue" id="scrollcue" style="display:none">&#8964;&nbsp; more below</div>
  </section>

  <!-- SCREEN 2: FOCUS (themed scene behind the verse) -->
  <section class="screen focus" data-name="Focus" id="focusScreen">
    <div class="scene on" id="sceneMoon">
      <div id="moonStars"></div>
      <div class="moonSm"><b style="width:15px;height:15px;top:17px;left:24px"></b><b style="width:9px;height:9px;top:52px;left:50px"></b></div>
    </div>
    <div class="scene" id="sceneFinger"><svg id="fingerSvg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice"></svg></div>
    <div class="scene" id="sceneDawn"><svg id="dawnSvg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice"></svg></div>
    <div class="scene" id="scenePond"><svg id="pondSvg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice"></svg></div>
    <div class="vignette"></div>
    <div class="inner">
      <div class="ref" id="fref">Abraham 1:2</div>
      <div class="fverse" id="fverse"></div>
    </div>
  </section>

  <!-- SCREEN 4: THE WEEK -->
  <section class="screen" data-name="This Week">
    <div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
    <div class="kicker">This Week</div>
    <hr class="rule">
    <div class="week" id="week"></div>
    <div class="agenda">
      <div>[Add a few things you want to see this week]</div>
      <div>[Tap the screen to flip pages]</div>
    </div>
  </section>

  <div class="foot" id="foot">
    <span class="navarrow">&#8249;</span>
    <span id="screenName">To-Do</span>
    <div class="dots" id="dots"></div>
    <span class="navarrow">&#8250;</span>
  </div>

<script>
  function pad(n){ return (n<10?"0":"")+n; }
  var D=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var DS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var M=["January","February","March","April","May","June","July","August","September","October","November","December"];

  // Scriptures (verbatim from churchofjesuschrist.org). scene: "moon" or "pond".
  var scriptures=[
    ["Abraham 1:2","And, finding there was greater happiness and peace and rest for me, I sought for the blessings of the fathers, and the right whereunto I should be ordained to administer the same; having been myself a follower of righteousness, desiring also to be one who possessed great knowledge, and to be a greater follower of righteousness, and to possess a greater knowledge, and to be a father of many nations, a prince of peace, and desiring to receive instructions, and to keep the commandments of God, I became a rightful heir, a High Priest, holding the right belonging to the fathers.","sceneMoon"],
    ["Ether 3:19","And because of the knowledge of this man he could not be kept from beholding within the veil; and he saw the finger of Jesus, which, when he saw, he fell with fear; for he knew that it was the finger of the Lord; and he had faith no longer, for he knew, nothing doubting.","sceneFinger"],
    ["Alma 5:12","And according to his faith there was a mighty change wrought in his heart. Behold I say unto you that this is all true.","sceneDawn"],
    ["Mosiah 18:30","And now it came to pass that all this was done in Mormon, yea, by the waters of Mormon, in the forest that was near the waters of Mormon; yea, the place of Mormon, the waters of Mormon, the forest of Mormon, how beautiful are they to the eyes of them who there came to the knowledge of their Redeemer.","scenePond"]
  ];
  var qi=0;
  function showScripture(){
    var s=scriptures[qi];
    document.getElementById("fref").textContent=s[0];
    document.getElementById("fverse").textContent=s[1];
    var scenes=document.querySelectorAll("#focusScreen .scene");
    for(var i=0;i<scenes.length;i++) scenes[i].classList.toggle("on", scenes[i].id===s[2]);
    qi=(qi+1)%scriptures.length;
  }

  // --- Per-day check-offs on this device. A new date = a fresh (all-unchecked) list each morning. ---
  function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function loadLocal(){ try { var o=JSON.parse(localStorage.getItem("kindleTodoDone")||"{}"); return (o.date===todayKey())?(o.done||{}):{}; } catch(e){ return {}; } }
  function saveLocal(o){ try { localStorage.setItem("kindleTodoDone", JSON.stringify({date:todayKey(), done:o})); } catch(e){} }
  var localDone = loadLocal();

  // --- Load the to-do list from todo.txt (lines; "x " prefix = done in the file). ---
  function renderTodos(text){
    var lines = text.split(/\r?\n/).map(function(s){return s.replace(/\s+$/,"");}).filter(function(s){return s.length;});
    var ul = document.getElementById("todoList");
    if (!lines.length){ ul.innerHTML = '<li class="td-empty">Nothing on the list. Add tasks in todo.txt.</li>'; return; }
    localDone = loadLocal();   // refresh in case the day rolled over while the page stayed open
    var html = "";
    lines.forEach(function(line, idx){
      var label = line.replace(/^x\s+/i,"");
      var key = label.toLowerCase();
      var done = localDone[key] === true;
      html += '<li class="todo'+(done?' done':'')+'" data-key="'+key.replace(/"/g,'&quot;')+'"><span>'+label.replace(/</g,'&lt;')+'</span></li>';
    });
    ul.innerHTML = html;
    setTimeout(updateCue, 40);
  }
  // Show "more below" only when the list overflows and isn't scrolled to the end.
  function updateCue(){
    var ul=document.getElementById("todoList"), cue=document.getElementById("scrollcue");
    if(!ul||!cue) return;
    var more = ul.scrollHeight > ul.clientHeight + 4 && (ul.scrollTop + ul.clientHeight) < (ul.scrollHeight - 4);
    cue.style.display = more ? "block" : "none";
  }
  // XMLHttpRequest (not fetch) — the Kindle's old browser may not support fetch.
  function fetchTodos(){
    try {
      var x = new XMLHttpRequest();
      x.open("GET", "todo.txt?t="+Date.now(), true);
      x.onreadystatechange = function(){
        if (x.readyState === 4){
          if (x.status >= 200 && x.status < 300) renderTodos(x.responseText);
          else document.getElementById("todoList").innerHTML='<li class="td-empty">Could not load todo.txt.</li>';
        }
      };
      x.send();
    } catch(e){ document.getElementById("todoList").innerHTML='<li class="td-empty">Could not load list.</li>'; }
  }

  // Find an enclosing to-do row WITHOUT Element.closest (old Kindle WebKit lacks it).
  function findTodoLi(node){
    while (node && node.nodeType === 1 && node !== document.body){
      if (node.tagName === "LI" && (" "+node.className+" ").indexOf(" todo ") > -1) return node;
      node = node.parentNode;
    }
    return null;
  }
  function toggleTask(li){
    var key = li.getAttribute("data-key");
    var nowDone = (" "+li.className+" ").indexOf(" done ") === -1;
    li.className = nowDone ? "todo done" : "todo";
    localDone[key] = nowDone; saveLocal(localDone);
  }

  function dayOfYear(d){ var s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
  function buildYear(){
    var d=new Date(), doy=dayOfYear(d);
    var total=(new Date(d.getFullYear(),11,31)-new Date(d.getFullYear(),0,0))/86400000;
    document.getElementById("dayNum").textContent=doy;
    document.getElementById("daysLeft").textContent=total-doy;
    document.getElementById("yearPct").textContent=Math.round(doy/total*100)+"%";
    var g=document.getElementById("grid"),h="";
    for(var i=1;i<=total;i++){ h+='<div class="cell'+(i<=doy?' on':'')+'"></div>'; }
    g.innerHTML=h;
  }
  function buildWeek(){
    var d=new Date(), monday=new Date(d); monday.setDate(d.getDate()-((d.getDay()+6)%7));
    var w=document.getElementById("week"),h="";
    for(var i=0;i<7;i++){ var day=new Date(monday); day.setDate(monday.getDate()+i);
      var t=day.toDateString()===d.toDateString();
      h+='<div class="day'+(t?' today':'')+'"><div class="dn">'+DS[day.getDay()]+'</div><div class="dd">'+day.getDate()+'</div></div>'; }
    w.innerHTML=h;
  }
  // Ether 3:19 — the finger of the Lord reaching from heaven toward the stones below.
  function buildFinger(){
    var svg=document.getElementById("fingerSvg"); if(!svg) return; var s="";
    for(var i=0;i<45;i++){ s+='<circle cx="'+(Math.random()*600).toFixed(0)+'" cy="'+(Math.random()*240).toFixed(0)+'" r="'+(Math.random()<0.8?1:1.8).toFixed(1)+'" fill="#fff" fill-opacity="'+(0.3+Math.random()*0.5).toFixed(2)+'"/>'; }
    for(var a=0;a<22;a++){ var x=(a/21)*600; s+='<line x1="300" y1="-50" x2="'+x.toFixed(0)+'" y2="800" stroke="#fff" stroke-opacity="'+(a%2?0.045:0.08)+'" stroke-width="1.2"/>'; }
    s+='<ellipse cx="300" cy="150" rx="55" ry="165" fill="#fff" fill-opacity="0.06"/>';
    s+='<path d="M284,-10 L316,-10 L313,205 Q313,250 300,257 Q287,250 287,205 Z" fill="#f2f2f2"/>';
    s+='<line x1="293" y1="34" x2="307" y2="34" stroke="#b5b5b5" stroke-width="2" stroke-opacity="0.55"/>';
    s+='<line x1="292" y1="96" x2="308" y2="96" stroke="#b5b5b5" stroke-width="2" stroke-opacity="0.45"/>';
    s+='<circle cx="300" cy="257" r="22" fill="#fff" fill-opacity="0.16"/><circle cx="300" cy="257" r="11" fill="#fff" fill-opacity="0.3"/>';
    for(var k=0;k<15;k++){ var sx=165+k*(270/14); var cy=694+((k%2)?6:0); var center=Math.abs(sx-300)<12;
      if(center){ s+='<circle cx="300" cy="690" r="20" fill="#fff" fill-opacity="0.16"/>'; }
      s+='<ellipse cx="'+sx.toFixed(0)+'" cy="'+cy+'" rx="11" ry="8" fill="'+(center?'#fff':'#c8c8c8')+'" fill-opacity="'+(center?0.95:0.6)+'"/>'; }
    svg.innerHTML=s;
  }
  // Alma 5:12 — a sunrise for the "mighty change" of heart.
  function buildDawn(){
    var svg=document.getElementById("dawnSvg"); if(!svg) return; var s="";
    for(var i=0;i<40;i++){ s+='<circle cx="'+(Math.random()*600).toFixed(0)+'" cy="'+(Math.random()*280).toFixed(0)+'" r="'+(Math.random()<0.8?1:1.7).toFixed(1)+'" fill="#fff" fill-opacity="'+(0.25+Math.random()*0.5).toFixed(2)+'"/>'; }
    for(var a=0;a<30;a++){ var ang=-Math.PI+(a/29)*Math.PI; var x=300+Math.cos(ang)*720, y=700+Math.sin(ang)*720;
      s+='<line x1="300" y1="700" x2="'+x.toFixed(0)+'" y2="'+y.toFixed(0)+'" stroke="#fff" stroke-opacity="'+(a%2?0.05:0.09)+'" stroke-width="1.3"/>'; }
    s+='<ellipse cx="300" cy="700" rx="230" ry="120" fill="#fff" fill-opacity="0.08"/>';
    s+='<circle cx="300" cy="704" r="66" fill="#fff" fill-opacity="0.9"/>';
    s+='<path d="M0,712 Q150,688 300,710 T600,706 L600,800 L0,800 Z" fill="#000" fill-opacity="0.85"/>';
    svg.innerHTML=s;
  }
  function buildPond(){
    var svg=document.getElementById("pondSvg"); if(!svg) return;
    function trees(baseY,h1,h2,step,w,op){ var x=-20,out=""; while(x<620){ var h=h1+Math.random()*(h2-h1); var hw=w*(0.6+Math.random()*0.5);
      out+='<path d="M'+x+','+baseY+' L'+(x+hw)+','+(baseY-h)+' L'+(x+hw*2)+','+baseY+' Z" fill="#000" fill-opacity="'+op+'"/>'; x+=step*(0.7+Math.random()*0.6); } return out; }
    var s='';
    s+='<ellipse cx="300" cy="672" rx="188" ry="50" fill="#ffffff" fill-opacity="0.10"/>';
    s+='<ellipse cx="300" cy="672" rx="188" ry="50" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1"/>';
    s+='<ellipse cx="300" cy="670" rx="24" ry="6" fill="#fff" fill-opacity="0.35"/>';
    s+='<line x1="155" y1="658" x2="445" y2="658" stroke="#fff" stroke-opacity="0.10" stroke-width="1"/>';
    s+='<line x1="180" y1="684" x2="420" y2="684" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>';
    s+=trees(644,90,180,46,40,0.55);
    s+=trees(660,60,130,38,32,1);
    svg.innerHTML=s;
  }
  function buildStars(){
    var box=document.getElementById("moonStars"); if(!box) return; var h="";
    for(var i=0;i<230;i++){
      var r=Math.random();
      var sz=(r<0.78?0.6+Math.random()*1.3:(r<0.95?2+Math.random()*1.3:3+Math.random()*1.4));
      var cls="fstar"+(sz>3?" big":"")+(Math.random()<0.16?" tw":"");
      // Keep most stars in the upper ~82% (above the mountains).
      var top=(Math.random()*82).toFixed(2);
      var delay=(Math.random()*3.6).toFixed(2);
      h+='<div class="'+cls+'" style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+top+'%;width:'+sz.toFixed(1)+'px;height:'+sz.toFixed(1)+'px;opacity:'+(0.35+Math.random()*0.6).toFixed(2)+';animation-delay:'+delay+'s"></div>';
    }
    box.innerHTML=h;
  }
  function tick(){
    var d=new Date();
    document.getElementById("hh").textContent=pad(d.getHours());
    document.getElementById("mm").textContent=pad(d.getMinutes());
    document.getElementById("date").textContent=D[d.getDay()]+", "+M[d.getMonth()]+" "+d.getDate();
  }

  var screens=document.querySelectorAll(".screen"), cur=0;
  function showScreen(n){
    cur=(n+screens.length)%screens.length;
    for(var i=0;i<screens.length;i++) screens[i].classList.toggle("active", i===cur);
    var name=screens[cur].dataset.name;
    document.getElementById("screenName").textContent=name;
    document.getElementById("foot").classList.toggle("onfocus", name==="Focus");
    var dots=document.querySelectorAll(".dot");
    for(var j=0;j<dots.length;j++) dots[j].classList.toggle("on", j===cur);
    if(name==="Focus"){ showScripture(); }
    if(name==="To-Do") fetchTodos();
  }
  window.showScreen=showScreen;

  (function(){ var dd=document.getElementById("dots"),h="";
    for(var i=0;i<screens.length;i++) h+='<div class="dot'+(i===0?' on':'')+'"></div>'; dd.innerHTML=h; })();

  // Auto-advance, but reset the timer on any tap so it won't flip while you use it.
  var autoTimer;
  function resetAuto(){ if(autoTimer) clearInterval(autoTimer); autoTimer=setInterval(function(){ showScreen(cur+1); }, 18000); }

  // Tap a task = check it off. Tap the LEFT quarter = go back. Tap elsewhere = go forward.
  document.body.addEventListener("click", function(e){
    var li = findTodoLi(e.target);
    if (li){ toggleTask(li); resetAuto(); return; }   // checking a box never flips the page
    var w = window.innerWidth || document.documentElement.clientWidth || 600;
    if (e.clientX < w * 0.22) showScreen(cur-1); else showScreen(cur+1);
    resetAuto();
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="ArrowRight"||e.key===" "){ showScreen(cur+1); resetAuto(); }
    if(e.key==="ArrowLeft"){ showScreen(cur-1); resetAuto(); }
  });

  document.getElementById("todoList").addEventListener("scroll", updateCue);
  buildWeek(); buildStars(); buildFinger(); buildDawn(); buildPond(); showScripture(); tick(); fetchTodos();
  setInterval(tick, 30000);
  setInterval(fetchTodos, 300000);   // refresh the list every 5 min
  resetAuto();
</script>
</body>
</html>
